<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RT 提取器</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="titles">
      <h1>Antigravity RT 提取</h1>
      <p class="hint">每个槽位一个账号：<code>邮箱----密码----2FA密钥</code></p>
      <button id="addr" class="addr" title="点击复制访问地址">检测中…</button>
    </div>
    <div class="actions">
      <button id="startAll" class="primary">全部开始</button>
      <button id="clear">清空记录</button>
    </div>
  </header>

  <main>
    <div class="statusbar">
      <span id="summary">等待输入</span>
      <span id="live" class="live">待命</span>
    </div>

    <section id="slots" class="slots"></section>

    <button id="addSlot" class="add-slot">+ 添加槽位</button>
    <p class="foot-hint">一个槽位仅一个账号；关闭页面任务仍在后台继续。</p>
  </main>

  <template id="slot">
    <article class="slot">
      <div class="slot-head">
        <span class="slot-index">#1</span>
        <span class="slot-email"></span>
        <span class="badge">空闲</span>
      </div>

      <div class="slot-input">
        <input class="line" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="邮箱----密码----2FA密钥" />
        <button class="run primary">开始</button>
        <button class="remove" title="删除槽位">×</button>
      </div>

      <p class="stage" hidden><span class="stage-text"></span><span class="elapsed"></span></p>
      <div class="progress" hidden><span class="bar"></span></div>

      <div class="rt-row" hidden>
        <input class="rt" readonly placeholder="refresh token" />
        <button class="copy">复制</button>
      </div>

      <p class="error" hidden></p>

      <div class="slot-actions" hidden>
        <button class="reset">重置</button>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
